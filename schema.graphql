schema {
  query: Query
  mutation: Mutation
}
type Query {
  pets: [Pet!]!
  users: [User!]!
}
"Pet object."
type Pet {
  id: ID!
  "The name of the pet."
  name: String!
  "The age of the pet in years."
  age: Int!
  owner: User
}
"User object."
type User {
  id: ID!
  "The first name of the user."
  firstName: String!
  "The last name of the user."
  lastName: String!
  "The email of the user."
  email: String!
  "A list of pets which belong to the user."
  pets: [Pet!]!
}
type Mutation {
  addPet(pet: PetInput!): Pet!
}
input PetInput {
  name: String!
  "The age of the pet in years."
  age: Int!
}
